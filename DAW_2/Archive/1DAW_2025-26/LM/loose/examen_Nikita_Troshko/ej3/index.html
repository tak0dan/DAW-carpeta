<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
    <style>
        body {
            background: url("") center/cover no-repeat;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #result {
            color: white;
            font-size: 4rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 2rem 3rem;
            border-radius: 12px;
        }
        #run {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: #bb1300;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.1s;
        }
        #run:hover {
            background: #003495;
            transform: scale(1.05);
        }
        #run:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <input type="button" id="run" value="Dame una frase">  
    <div id="result"></div>        
    <script>
        //cambia y añade lo que necesites!!!!


        /* resultado boton*/
        //variables
        let urlServer="http://server:8888"
        let url=urlServer+"/frases.php"
        let boton = document.getElementById("run")
        let resultado = document.getElementById("result")
        let preguntas = []
        let usadas = []

        function numeroAleatorio(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min
        }

        function  getFondo(){
            let n = numeroAleatorio(1, 27);
            document.body.style.backgroundImage = `url("${urlServer}/images/${n}.jpeg")`;
        }  

        fetch(url)
            .then(r => r.json())
            .then(data => preguntas = Object.values(data))
            .catch(e => console.error(e))

        boton.addEventListener("click", () => {
            getFondo()

            if (usadas.length >= preguntas.length) {
                resultado.innerHTML = "Ya se han mostrado todas las preguntas"
                return
            }
            let disponibles = preguntas.filter((_, i) => !usadas.includes(i))
            let idx = Math.floor(Math.random() * disponibles.length)
            let p = disponibles[idx]
            let posReal = preguntas.indexOf(p)
            usadas.push(posReal)
            resultado.innerHTML = `
                <p><strong>${p.phrase}</strong></p>

                <p style="color:gray">Quedan ${preguntas.length - usadas.length} preguntas sin mostrar</p>
            `
        })

      

        // pide la imagen inicial
    </script>


</body>
</html>
