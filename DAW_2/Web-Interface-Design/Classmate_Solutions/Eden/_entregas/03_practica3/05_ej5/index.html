<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Ejercicio de Flotar y Posicionamiento</title>
    <style type="text/css">
        /* El enunciado indica que pongamos aquí el código CSS en lugar de en un archivo a parte.  */

        div {
            background-color: green;
            padding: 10px;
            overflow: hidden;  /* overflow: hidden hace que el div sí contenga los elementos flotantes (que el float había sacado del flujo) y calcule su altura teniéndolos en cuenta. Tuve que añadirlo porque sino el texto sobresalía del fondo verde. */
        }


        .anterior {
            float: left;
        }


        .siguiente {
            float: right;
        }


    </style>
</head>
<body>
    <div>
        <span class="anterior">&laquo; Anterior</span>
        <span class="siguiente">Siguiente &raquo;</span>
    </div>
</body>
</html>
