  </body>
  <script>
    let finalResult;
    let evenOddResult;

    // Add your code here
    //{{-------------------------------------------------------
    let number1 = 3;
    let number2 = 5; 
    let number3 = 10;
    let number4 = 4;

    let operation1 = number1 + number2;
    let operation2 = number3 - number4;

    finalResult = operation1 * operation2;

    evenOddResult = finalResult % 2;

    //}}-------------------------------------------------------
    // Don't edit the code below here!

    const body = document.querySelector('body');
    const para1 = document.createElement('p');
    const finalResultCheck = finalResult === 48 ?
      `Yes, well done!` : `No, it is ${ finalResult }`;
    para1.textContent = `Is the finalResult 48? ${ finalResultCheck }`;
    const para2 = document.createElement('p');
    const evenOddResultCheck = evenOddResult === 0 ?
      'The final result is even!' : 'The final result is odd. Hrm.'
    para2.textContent = evenOddResultCheck;
    body.appendChild(para1);
    body.appendChild(para2);
  </script>
